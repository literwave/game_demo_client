syntax = "proto3";

package User;

import "common.proto";

message c2s_user_base_info {
}

message s2c_user_base_info {
	string name = 1;
    int32 headIcon = 2;
    int32 sex = 3;
    int32 birthTime = 4;
}

message c2s_user_create {
    string name = 1;
    int32 sex = 2;
}

message s2c_user_create {
    string name = 1;
    int32 sex = 2;
}

message c2s_req_user_res {
}

message s2c_req_user_res {
    repeated Common.p_common_info resList = 1;
}

message s2c_sync_user_res_list {
    repeated Common.p_common_info resList = 1;
}

message s2c_sys_notify_by_lanid {
    repeated string tbl = 1;
}

message s2c_tell_me {
    string msg = 1;
}

message c2s_gm_command {
    string cmd = 1;
}

message s2c_gm_command_help {
    repeated Common.p_common_info ret = 1;
}